<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="beskyttet.css">
    <script src="beskyttet.js" defer></script>
</head>
<body>
    <h1>Du ser nå de hemmelige dataene!</h1>
    <main>
        <section id="brukerInfo">
            <h2>Min side</h2>
            <div id="brukerData">
                <!-- Brukerdata vil bli lastet her -->
            </div>
        </section>

        <!-- Vises kun for support-brukere -->
        <section id="supportSeksjon" style="display:none;">
            <h2>Support – alle brukeres navn</h2>
            <div id="supportData">
                <!-- Støttedata vil bli lastet her -->
            </div>
        </section>

        <!-- Vises kun for admin-brukere -->
        <section id="adminSeksjon" style="display:none;">
            <h2>Admin – fullstendig brukeroversikt</h2>
            <div id="adminData">
                <!-- Admin-data vil bli lastet her -->
            </div>
        </section>
    </main>
    <button id="logoutButton">Logg ut</button>

    <!-- Test-del for å se om man kan besøke de ulike rutene direkte. -->
    <br><br>
    <div>
        <a href="/api/support/brukere">Support-rute</a>
        <a href="/api/admin/brukere">Admin-rute</a>    
    </div> 
</body>
</html>
